{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Content }}<div>{{ . }}</div>{{ end }}

<ul class="post-list">
{{ range .Pages.ByDate.Reverse }}
  <li>
    {{ if not .Date.IsZero }}<span class="post-date">{{ .Date.Format "2 Jan 2006" }}</span>{{ end }}
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
{{ end }}
</ul>
{{ end }}
