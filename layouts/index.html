{{ define "main" }}
{{ with .Content }}<div class="intro">{{ . }}</div>{{ end }}

<h1>Posts</h1>
<ul class="post-list">
{{ range (where site.RegularPages "Type" "in" site.Params.mainSections).ByDate.Reverse }}
  <li>
    <span class="post-date">{{ .Date.Format "2 Jan 2006" }}</span>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
{{ end }}
</ul>
{{ end }}
